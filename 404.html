<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nonsense Arcade · 404</title>
<meta name="robots" content="noindex">
<style>
/* GitHub Pages serves this file for every missing path, at any depth, so the way home is an
   absolute path, never a relative one. */
:root {
  --bg: #f1ece2; --ink: #23201b; --muted: #6b645a; --accent: #b4462f; --line: #23201b26;
  --f: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140f; --ink: #ece4d6; --muted: #a59b8c; --accent: #e3735a; --line: #ece4d626; color-scheme: dark; }
}
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 18px/1.5 var(--f);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 34rem; display: grid; gap: 14px; padding-block: 24px; }
.ticket { font: 600 12px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: clamp(34px, 8vw, 54px); line-height: 1; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
p[lang="fr"] { border-top: 1px solid var(--line); padding-top: 14px; }
a { color: var(--accent); font-weight: 600; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="ticket">Ticket 404 · not valid for this ride</div>
  <h1>This game has wandered off.</h1>
  <p>Nothing lives at this address. It may have been a very small game, or a typo, or a moon.
    <a href="/nonsense-arcade/">Back to the arcade</a>.</p>
  <p lang="fr">Il n’y a rien à cette adresse. C’était peut-être un très petit jeu, une faute de
    frappe, ou une lune. <a href="/nonsense-arcade/">Retour à l’arcade</a>.</p>
</main>
</body>
</html>
